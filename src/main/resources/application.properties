# Base LLM (used by the specialist agents for the actual answers)
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.timeout=120
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# --- Decision-model backend (System One) -------------------------------------
# Which model makes the routing + guardrail decisions. One of:
#   jev   -> the hosted TypeSafe Jev API (falls back to the stub if no key)
#   laya  -> a self-hosted Laya sidecar over HTTP (falls back to the stub if down)
#   stub  -> a deterministic offline stand-in (no network, no key, no model)
decision.backend=jev

# TypeSafe Jev (hosted System One endpoint).
# Key comes from TYPESAFE_API_KEY (or JEV_API_KEY). When neither is set, requests fall back
# to the deterministic stub.
jev.api-key=${TYPESAFE_API_KEY:${JEV_API_KEY:}}
quarkus.rest-client.jev.url=https://api.typesafe.ai
quarkus.rest-client.jev.connect-timeout=10000
# Jev answers in ~0.3 s (median); a hung call falls back to the stub after 5 s.
quarkus.rest-client.jev.read-timeout=5000
jev.model=jev-latest

# Laya (self-hosted). Point this at the sidecar in laya-sidecar/ (default port 8100).
quarkus.rest-client.laya.url=http://localhost:8100
quarkus.rest-client.laya.connect-timeout=5000
quarkus.rest-client.laya.read-timeout=60000
laya.model=laya

# --- Routing policy -----------------------------------------------------------
# One decision call asks a Choice (which specialist?) plus a yes/no per specialist.
# Every specialist whose yes/no probability is above this value is called (several ->
# fan-out + merge). When none is, the Choice decides.
routing.fan-out-threshold=0.5

quarkus.http.port=8083
