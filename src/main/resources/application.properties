# Base LLM (used by the specialist agents for the actual answers)
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.timeout=120
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# --- Decision-model backend (System One) -------------------------------------
# Which model makes the routing + guardrail decisions. One of:
#   jev   -> the hosted TypeSafe Jev API (falls back to the stub if no key)
#   kev   -> a self-hosted Kev server (falls back to the stub if down)
#   laya  -> a self-hosted Laya sidecar (falls back to the stub if down)
#   stub  -> a deterministic offline stand-in (no network, no key, no model)
decision.backend=jev

# Named TypeSafe-compatible decision models. Quarkus creates one DecisionModel bean per name.
# A sentinel lets the Jev bean initialize without a key; ActiveDecisionClient detects it and uses
# the deterministic stub without making a network request.
quarkus.langchain4j.jev.decision-model.provider=typesafe
jev.api-key=${TYPESAFE_API_KEY:${JEV_API_KEY:}}
quarkus.langchain4j.typesafe.jev.api-key=${TYPESAFE_API_KEY:${JEV_API_KEY:missing}}
quarkus.langchain4j.typesafe.jev.base-url=https://api.typesafe.ai
quarkus.langchain4j.typesafe.jev.timeout=5s
quarkus.langchain4j.typesafe.jev.decision-model.model-name=jev-latest

# Kev implements the same /v1/systemone API. Start its server on port 8009.
quarkus.langchain4j.kev.decision-model.provider=typesafe
quarkus.langchain4j.typesafe.kev.base-url=${KEV_BASE_URL:http://localhost:8009}
quarkus.langchain4j.typesafe.kev.timeout=60s
quarkus.langchain4j.typesafe.kev.decision-model.model-name=${KEV_MODEL:kev-latest}

# Laya exposes a /v1/systemone compatibility route in laya-sidecar/.
quarkus.langchain4j.laya.decision-model.provider=typesafe
quarkus.langchain4j.typesafe.laya.base-url=${LAYA_BASE_URL:http://localhost:8100}
quarkus.langchain4j.typesafe.laya.timeout=60s
quarkus.langchain4j.typesafe.laya.decision-model.model-name=${LAYA_MODEL:laya}

# --- Routing policy -----------------------------------------------------------
# The core DecisionRouterPlanner asks one yes/no question per specialist.
# Every specialist at or above this threshold runs in parallel. If none qualifies,
# GeneralFallback invokes the general agent as a separate workflow step.
routing.fan-out-threshold=0.5

quarkus.http.port=8083
